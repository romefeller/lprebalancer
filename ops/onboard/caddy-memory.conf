# /etc/systemd/system/caddy.service.d/memory.conf: the old Caddy died from an OOM
# kill. Caddy now has its own ceiling (the kernel kills Caddy, not the bots) and
# restarts on its own; GOMEMLIMIT makes Go collect before the ceiling.
[Service]
Environment=GOMEMLIMIT=150MiB
MemoryHigh=200M
MemoryMax=256M
Restart=on-failure
RestartSec=5
